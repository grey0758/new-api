name: OpenCodex CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: opencodex-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/opencodex-test-matrix.yml
